<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1020">
  <title>มนุษย์หมาป่า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@400;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Chakra+Petch:wght@500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-time="night">
  <div class="sky" aria-hidden="true"><div class="orb"></div></div>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="peek" hidden></div>
  <div id="editor" class="modal" hidden></div>
  <section id="chat" aria-label="แชท" hidden>
    <header class="row spread">
      <div class="row" style="gap:8px;min-width:0"><b>แชท</b><span id="chat-where" class="ch-pill"></span></div>
      <button id="chat-size" class="chip-btn" type="button" aria-pressed="false">ขยาย</button>
    </header>
    <ul id="chat-list" aria-live="polite"></ul>
    <form id="chat-form" class="row" autocomplete="off">
      <input id="chat-input" class="input" maxlength="300" aria-label="ข้อความ">
      <button class="btn primary" type="submit">ส่ง</button>
    </form>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="/cosmetics.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
